<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PatrongBAA Farms - WhatsApp Business Onboarding</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 42px 32px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
    }

    h1 {
      margin: 0 0 22px;
      font-size: 30px;
      color: #111827;
    }

    .description {
      margin: 0 auto 30px;
      max-width: 520px;
      font-size: 18px;
      line-height: 1.55;
      color: #374151;
    }

    .connect-btn {
      border: none;
      border-radius: 8px;
      padding: 16px 34px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      background: #1877f2;
      color: white;
      transition: opacity 0.2s ease;
    }

    .connect-btn:hover {
      opacity: 0.9;
    }

    .connect-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 24px;
      font-size: 16px;
      line-height: 1.5;
      color: #374151;
    }

    .error {
      color: #b91c1c !important;
    }

    .success {
      color: #166534 !important;
    }
  </style>

  <!-- Facebook JavaScript SDK -->
  <script>
    window.fbAsyncInit = function () {
      FB.init({
        appId: '1052159027462760',
        cookie: true,
        xfbml: true,
        version: 'v26.0'
      });

      FB.AppEvents.logPageView();
    };

    (function (d, s, id) {
      var js;
      var fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';

      fjs.parentNode.insertBefore(js, fjs);
    }(document, 'script', 'facebook-jssdk'));
  </script>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>PatrongBAA Farms</h1>

      <p class="description">
        Connect this WhatsApp Business app number to the WhatsApp Business
        Platform while continuing to use the WhatsApp Business app.
      </p>

      <button
        id="connectButton"
        class="connect-btn"
        onclick="launchWhatsAppSignup()">
        Connect WhatsApp Business
      </button>

      <div id="status"></div>

    </div>
  </div>

  <script>

    /*
      ============================================================
      PATRONGBAA FARMS - WHATSAPP ONBOARDING
      ============================================================
    */

    const N8N_WEBHOOK_URL =
      'https://bernardmendy.app.n8n.cloud/webhook/patrongbaa-onboarding';

    /*
      IMPORTANT:
      This is the stable redirect URI we are testing.

      It must match the redirect_uri used during the OAuth
      authorization-code exchange in n8n.
    */
    const REDIRECT_URI =
      'https://benwiston1-patrongbaa.github.io/patrongbaa-whatsapp-onboarding/';


    /*
      ------------------------------------------------------------
      Send authorization code to n8n
      ------------------------------------------------------------
    */

    async function sendCodeToBackend(code) {

      const status = document.getElementById('status');

      status.className = '';
      status.textContent =
        'Authorization code received. Completing WhatsApp Business Platform connection...';

      try {

        const body = new URLSearchParams();

        body.append('code', code);

        const response = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',

          headers: {
            'Content-Type':
              'application/x-www-form-urlencoded;charset=UTF-8'
          },

          body: body.toString()
        });

        if (!response.ok) {
          throw new Error(
            'Backend returned HTTP ' + response.status
          );
        }

        status.className = 'success';

        status.textContent =
          'Authorization code sent successfully. Completing WhatsApp Business Platform connection...';

      } catch (error) {

        console.error('Error sending authorization code:', error);

        status.className = 'error';

        status.textContent =
          'The authorization code could not be sent to the onboarding server. Please try again.';
      }
    }


    /*
      ------------------------------------------------------------
      Facebook Login callback
      ------------------------------------------------------------
    */

    function fbLoginCallback(response) {

      console.log('Facebook Login response:', response);

      const status = document.getElementById('status');

      if (
        response &&
        response.authResponse &&
        response.authResponse.code
      ) {

        const code = response.authResponse.code;

        sendCodeToBackend(code);

      } else {

        status.className = 'error';

        status.textContent =
          'WhatsApp Business authorization was not completed. Please try again.';

        console.error(
          'No authorization code returned:',
          response
        );
      }
    }


    /*
      ------------------------------------------------------------
      Launch WhatsApp Business Coexistence onboarding
      ------------------------------------------------------------
    */

    function launchWhatsAppSignup() {

      const button =
        document.getElementById('connectButton');

      const status =
        document.getElementById('status');

      button.disabled = true;

      status.className = '';

      status.textContent =
        'Opening WhatsApp Business onboarding...';


      FB.login(
        fbLoginCallback,
        {

          /*
            Meta Business Login configuration
          */
          config_id: '952366671241090',

          /*
            Authorization-code response
          */
          response_type: 'code',

          /*
            Required when using response_type=code
          */
          override_default_response_type: true,

          /*
            TARGETED CHANGE:
            Use the stable PatrongBAA Farms callback URI
            instead of the SDK-generated dynamic callback.
          */
          redirect_uri: REDIRECT_URI,

          /*
            WhatsApp Business App onboarding =
            WhatsApp Coexistence flow.
          */
          extras: {

            setup: {},

            featureType:
              'whatsapp_business_app_onboarding',

            sessionInfoVersion:
              '3'
          }
        }
      );
    }

  </script>

</body>
</html>
