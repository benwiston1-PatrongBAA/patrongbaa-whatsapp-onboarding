<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatrongBAA Farms — WhatsApp Onboarding</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 0 auto; padding: 48px 24px; line-height: 1.5; }
    .card { border: 1px solid #ddd; border-radius: 16px; padding: 32px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
    h1 { margin-top: 0; }
    button { background:#1877f2; color:#fff; border:0; border-radius:8px; padding:14px 22px; font-size:16px; cursor:pointer; }
    button:hover { opacity:.92; }
    #status { margin-top:20px; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PatrongBAA Farms</h1>
    <p>Connect this WhatsApp Business app number to the WhatsApp Business Platform while continuing to use the WhatsApp Business app.</p>
    <button onclick="launchWhatsAppSignup()">Connect WhatsApp Business</button>
    <div id="status"></div>
  </div>

  <script>
    window.fbAsyncInit = function() {
      FB.init({
        appId: '1052159027462760',
        autoLogAppEvents: true,
        xfbml: true,
        version: 'v26.0'
      });
    };

    window.addEventListener('message', (event) => {
      // Meta sends Embedded Signup session data here.
      console.log('Embedded Signup message:', event.data);
    });

    const fbLoginCallback = async (response) => {
  const status = document.getElementById('status');

  if (!response.authResponse) {
    status.textContent =
      'The Meta login/Embedded Signup flow was cancelled or did not return an authorization response.';
    console.log('Embedded Signup response:', response);
    return;
  }

  const code = response.authResponse.code;

  status.textContent =
    'Meta authorization completed. Sending authorization code to the secure backend...';

  try {
    const result = await fetch(
      'https://bernardmendy.app.n8n.cloud/webhook/0df3fa4c-3925-4a8c-81c5-00e673ee38f8',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          code: code
        })
      }
    );

    if (result.ok) {
      status.textContent =
        'Authorization code sent successfully. Completing WhatsApp Business Platform connection...';
    } else {
      status.textContent =
        'The authorization code could not be sent to the backend.';
      console.error('Backend response:', await result.text());
    }
  } catch (error) {
    status.textContent =
      'Could not connect to the onboarding backend.';
    console.error('Backend error:', error);
  }
};

    const launchWhatsAppSignup = () => {
      FB.login(fbLoginCallback, {
        config_id: '952366671241090',
        response_type: 'code',
        override_default_response_type: true,
        extras: {
          version: 'v4',
          featureType: 'whatsapp_business_app_onboarding'
        }
      });
    };
  </script>

  <script async defer crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js"></script>
</body>
</html>
