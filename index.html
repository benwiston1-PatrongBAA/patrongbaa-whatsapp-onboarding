<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PatrongBAA Farms - WhatsApp Business Onboarding</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fa;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2937;
    }

    .card {
      width: 90%;
      max-width: 650px;
      background: #ffffff;
      padding: 45px 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 32px;
    }

    p {
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    button {
      background: #1877f2;
      color: #ffffff;
      border: 0;
      border-radius: 6px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #166fe5;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 25px;
      font-size: 15px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>PatrongBAA Farms</h1>

    <p>
      Connect this WhatsApp Business app number to the WhatsApp Business
      Platform while continuing to use the WhatsApp Business app.
    </p>

    <button
      id="connectButton"
      onclick="launchWhatsAppSignup()">
      Connect WhatsApp Business
    </button>

    <div id="status"></div>

  </div>


  <!-- Facebook JavaScript SDK -->

  <script>

    window.fbAsyncInit = function () {

      FB.init({
        appId: '1052159027462760',
        cookie: true,
        xfbml: true,
        version: 'v26.0'
      });

      console.log('Facebook SDK initialized successfully.');

    };


    (function (d, s, id) {

      var js;
      var fjs = d.getElementsByTagName(s)[0];

      if (d.getElementById(id)) {
        return;
      }

      js = d.createElement(s);
      js.id = id;
      js.src = 'https://connect.facebook.net/en_US/sdk.js';

      fjs.parentNode.insertBefore(js, fjs);

      console.log('Facebook SDK initialization started.');

    }(document, 'script', 'facebook-jssdk'));

  </script>


  <script>

    /*
     * n8n production webhook
     */

    const N8N_WEBHOOK_URL =
      'https://bernardmendy.app.n8n.cloud/webhook/patrongbaa-onboarding';


    /*
     * Send the Meta authorization code to n8n.
     *
     * We use application/x-www-form-urlencoded so the browser
     * can send the request without a CORS preflight.
     */

    const sendCodeToBackend = async (code) => {

      const status = document.getElementById('status');
      const button = document.getElementById('connectButton');

      status.textContent =
        'Meta authorization completed. Sending authorization code to the secure backend...';

      button.disabled = true;

      try {

        const formData = new URLSearchParams();

        formData.append('code', code);

        const result = await fetch(
          N8N_WEBHOOK_URL,
          {
            method: 'POST',
            body: formData
          }
        );


        const responseText = await result.text();

        console.log(
          'n8n backend response:',
          result.status,
          responseText
        );


        if (result.ok) {

          status.textContent =
            'Authorization code sent successfully. Completing WhatsApp Business Platform connection...';

        } else {

          status.textContent =
            'The onboarding backend returned an error. Please check the n8n execution.';

          console.error(
            'n8n backend error:',
            result.status,
            responseText
          );

          button.disabled = false;

        }

      } catch (error) {

        console.error(
          'Backend error:',
          error
        );

        status.textContent =
          'Could not connect to the onboarding backend.';

        button.disabled = false;

      }

    };


    /*
     * Facebook Login callback.
     *
     * The callback itself is deliberately NOT async.
     */

    const fbLoginCallback = (response) => {

      const status = document.getElementById('status');

      console.log(
        'Facebook login callback:',
        response
      );


      if (
        response &&
        response.authResponse &&
        response.authResponse.code
      ) {

        const code = response.authResponse.code;

        console.log(
          'Authorization code received from Meta.'
        );

        /*
         * Do not display the authorization code.
         */

        sendCodeToBackend(code);

      } else {

        status.textContent =
          'The Meta login/Embedded Signup flow was cancelled or did not return an authorization response.';

        console.log(
          'Embedded Signup response:',
          response
        );

      }

    };


    /*
     * Launch Meta Embedded Signup.
     *
     * IMPORTANT:
     *
     * featureType:
     * whatsapp_business_app_onboarding
     *
     * is what selects the WhatsApp Business App
     * Coexistence onboarding flow.
     */

    const launchWhatsAppSignup = () => {

      const status = document.getElementById('status');
      const button = document.getElementById('connectButton');

      console.log(
        'Connect WhatsApp Business button clicked.'
      );


      status.textContent =
        'Opening Meta WhatsApp Business onboarding...';

      button.disabled = true;


      if (typeof FB === 'undefined') {

        console.error(
          'Facebook SDK is not available.'
        );

        status.textContent =
          'Facebook SDK has not loaded yet. Please refresh the page and try again.';

        button.disabled = false;

        return;

      }


      console.log(
        'Facebook SDK is ready.'
      );


      FB.login(
        fbLoginCallback,
        {
          config_id: '952366671241090',

          response_type: 'code',

          override_default_response_type: true,

          extras: {

            /*
             * Required empty setup object for the v4
             * Embedded Signup launch.
             */

            setup: {},

            /*
             * THIS IS THE COEXISTENCE SELECTOR.
             *
             * It tells Meta that we are onboarding an
             * existing WhatsApp Business App number while
             * keeping the Business App active.
             */

            featureType: 'whatsapp_business_app_onboarding'

          }

        }
      );

    };

  </script>

</body>
</html>
