<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PatrongBAA Farms - WhatsApp Business Onboarding</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      background: #f5f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1f2937;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #ffffff;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .logo {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0b7a3b;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
      color: #14532d;
    }

    .subtitle {
      margin: 0 auto 25px;
      max-width: 430px;
      line-height: 1.6;
      color: #4b5563;
      font-size: 15px;
    }

    .connect-button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      background: #1877f2;
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .connect-button:hover {
      opacity: 0.92;
    }

    .connect-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status {
      margin-top: 22px;
      padding: 14px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #4b5563;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #ecfdf5;
      color: #166534;
    }

    .status.error {
      background: #fef2f2;
      color: #991b1b;
    }

    .status.loading {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .small {
      margin-top: 22px;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">
      P
    </div>

    <h1>PatrongBAA Farms</h1>

    <p class="subtitle">
      Connect this WhatsApp Business app number to the
      WhatsApp Business Platform while continuing to use
      the WhatsApp Business app.
    </p>

    <button
      id="connectButton"
      class="connect-button"
      onclick="startWhatsAppConnection()"
    >
      Connect WhatsApp Business
    </button>

    <div id="status" class="status"></div>

    <div class="small">
      Your WhatsApp Business app remains available while the
      connection is being completed.
    </div>

  </div>


  <script>

    /*
     * ============================================================
     * PATRONGBAA FARMS
     * WHATSAPP COEXISTENCE ONBOARDING
     * ============================================================
     *
     * IMPORTANT:
     *
     * We are NOT going back to FB.login().
     *
     * The manual OAuth URL solved the redirect_uri problem.
     *
     * We keep that working approach.
     *
     * We are now additionally listening for Meta's
     * WA_EMBEDDED_SIGNUP session information so we can capture:
     *
     *   - waba_id
     *   - phone_number_id
     *   - business_id
     *
     * especially for:
     *
     *   FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING
     */


    // ------------------------------------------------------------
    // META APP SETTINGS
    // ------------------------------------------------------------

    const APP_ID = "1052159027462760";

    const CONFIG_ID = "952366671241090";


    // ------------------------------------------------------------
    // FIXED REDIRECT URI
    // ------------------------------------------------------------

    const REDIRECT_URI =
      "https://benwiston1-patrongbaa.github.io/patrongbaa-whatsapp-onboarding/";


    // ------------------------------------------------------------
    // N8N WEBHOOK
    // ------------------------------------------------------------

    const N8N_WEBHOOK =
      "https://bernardmendy.app.n8n.cloud/webhook/patrongbaa-onboarding";


    // ------------------------------------------------------------
    // META GRAPH VERSION
    // ------------------------------------------------------------

    const META_VERSION = "v26.0";


    // ------------------------------------------------------------
    // STORAGE KEYS
    // ------------------------------------------------------------

    const OAUTH_STATE_KEY =
      "patrongbaa_oauth_state";

    const SIGNUP_INFO_KEY =
      "patrongbaa_whatsapp_signup_info";


    // ------------------------------------------------------------
    // UI HELPERS
    // ------------------------------------------------------------

    function showStatus(message, type = "") {

      const status =
        document.getElementById("status");

      status.textContent = message;

      status.className = "status show";

      if (type) {
        status.classList.add(type);
      }
    }


    function setButtonDisabled(disabled) {

      const button =
        document.getElementById("connectButton");

      button.disabled = disabled;
    }


    // ------------------------------------------------------------
    // GENERATE STATE
    // ------------------------------------------------------------

    function generateState() {

      const randomValues =
        new Uint8Array(24);

      crypto.getRandomValues(randomValues);

      return Array.from(randomValues)
        .map(byte =>
          byte.toString(16).padStart(2, "0")
        )
        .join("");
    }


    // ------------------------------------------------------------
    // COEXISTENCE SESSION INFO LISTENER
    // ------------------------------------------------------------
    //
    // Meta sends a postMessage during Embedded Signup.
    //
    // We are specifically looking for:
    //
    //   type:
    //     WA_EMBEDDED_SIGNUP
    //
    //   event:
    //     FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING
    //
    // The payload can contain:
    //
    //   waba_id
    //   phone_number_id
    //   business_id
    //
    // We save the information in sessionStorage so that the
    // OAuth callback can use it.
    //

    window.addEventListener(
      "message",
      function (event) {

        // --------------------------------------------------------
        // SECURITY: ACCEPT ONLY META DOMAINS
        // --------------------------------------------------------

        const allowedOrigin =
          event.origin === "https://www.facebook.com" ||
          event.origin === "https://web.facebook.com";

        if (!allowedOrigin) {
          return;
        }


        // --------------------------------------------------------
        // PARSE EVENT
        // --------------------------------------------------------

        let data;

        try {

          data =
            typeof event.data === "string"
              ? JSON.parse(event.data)
              : event.data;

        } catch (error) {

          // Ignore non-JSON messages from Meta.

          return;
        }


        // --------------------------------------------------------
        // ONLY PROCESS WHATSAPP EMBEDDED SIGNUP EVENTS
        // --------------------------------------------------------

        if (
          !data ||
          data.type !== "WA_EMBEDDED_SIGNUP"
        ) {
          return;
        }


        console.log(
          "Meta WhatsApp Embedded Signup event:",
          data
        );


        const eventName =
          String(data.event || "").toUpperCase();


        const payload =
          data.data || {};


        // --------------------------------------------------------
        // SAVE SESSION INFORMATION
        // --------------------------------------------------------

        const signupInfo = {

          event:
            eventName,

          waba_id:
            payload.waba_id || null,

          phone_number_id:
            payload.phone_number_id || null,

          business_id:
            payload.business_id || null,

          timestamp:
            new Date().toISOString()

        };


        sessionStorage.setItem(
          SIGNUP_INFO_KEY,
          JSON.stringify(signupInfo)
        );


        // --------------------------------------------------------
        // COEXISTENCE SUCCESS
        // --------------------------------------------------------

        if (
          eventName ===
          "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING"
        ) {

          console.log(
            "Coexistence onboarding completed:",
            signupInfo
          );


          showStatus(
            "Meta has completed the WhatsApp Business app connection. Finishing the platform connection...",
            "success"
          );


          return;
        }


        // --------------------------------------------------------
        // STANDARD FINISH
        // --------------------------------------------------------

        if (
          eventName === "FINISH"
        ) {

          console.log(
            "Embedded Signup completed:",
            signupInfo
          );

          return;
        }


        // --------------------------------------------------------
        // ERROR
        // --------------------------------------------------------

        if (
          eventName === "ERROR"
        ) {

          console.error(
            "Meta Embedded Signup error:",
            payload
          );

          showStatus(
            "Meta returned an error during WhatsApp Business onboarding.",
            "error"
          );

          return;
        }


        // --------------------------------------------------------
        // CANCEL / OTHER EVENTS
        // --------------------------------------------------------

        console.log(
          "Meta Embedded Signup event:",
          eventName,
          payload
        );

      }
    );


    // ------------------------------------------------------------
    // START WHATSAPP COEXISTENCE
    // ------------------------------------------------------------

    function startWhatsAppConnection() {

      setButtonDisabled(true);


      showStatus(
        "Opening Meta WhatsApp Business onboarding...",
        "loading"
      );


      // ----------------------------------------------------------
      // GENERATE FRESH STATE
      // ----------------------------------------------------------

      const state =
        generateState();


      sessionStorage.setItem(
        OAUTH_STATE_KEY,
        state
      );


      // ----------------------------------------------------------
      // CLEAR OLD SIGNUP INFORMATION
      // ----------------------------------------------------------

      sessionStorage.removeItem(
        SIGNUP_INFO_KEY
      );


      // ----------------------------------------------------------
      // BUILD META OAUTH PARAMETERS
      // ----------------------------------------------------------

      const params =
        new URLSearchParams();


      params.set(
        "client_id",
        APP_ID
      );


      params.set(
        "config_id",
        CONFIG_ID
      );


      params.set(
        "redirect_uri",
        REDIRECT_URI
      );


      params.set(
        "response_type",
        "code"
      );


      params.set(
        "override_default_response_type",
        "true"
      );


      params.set(
        "state",
        state
      );


      // ----------------------------------------------------------
      // CRITICAL COEXISTENCE SETTING
      // ----------------------------------------------------------

      params.set(
        "extras",
        JSON.stringify({

          setup: {},

          featureType:
            "whatsapp_business_app_onboarding",

          sessionInfoVersion:
            "3"

        })
      );


      params.set(
        "locale",
        "en_US"
      );


      // ----------------------------------------------------------
      // BUILD META URL
      // ----------------------------------------------------------

      const oauthUrl =
        "https://www.facebook.com/" +
        META_VERSION +
        "/dialog/oauth?" +
        params.toString();


      console.log(
        "Opening Meta OAuth:",
        oauthUrl
      );


      /*
       * IMPORTANT
       *
       * We use the same stable redirect URI that already worked.
       *
       * The OAuth page opens in the current browser window.
       *
       * DO NOT change redirect_uri.
       */

      window.location.href =
        oauthUrl;
    }


    // ------------------------------------------------------------
    // GET SAVED COEXISTENCE INFORMATION
    // ------------------------------------------------------------

    function getSignupInfo() {

      const stored =
        sessionStorage.getItem(
          SIGNUP_INFO_KEY
        );


      if (!stored) {
        return null;
      }


      try {

        return JSON.parse(stored);

      } catch (error) {

        console.error(
          "Could not parse saved signup information:",
          error
        );

        return null;
      }
    }


    // ------------------------------------------------------------
    // SEND AUTHORIZATION CODE TO N8N
    // ------------------------------------------------------------

    async function sendCodeToN8n(code) {

      showStatus(
        "Authorization code received. Completing WhatsApp Business Platform connection...",
        "loading"
      );


      setButtonDisabled(true);


      // ----------------------------------------------------------
      // READ COEXISTENCE SESSION INFORMATION
      // ----------------------------------------------------------

      const signupInfo =
        getSignupInfo();


      console.log(
        "Coexistence information available:",
        signupInfo
      );


      // ----------------------------------------------------------
      // BUILD REQUEST BODY
      // ----------------------------------------------------------

      const body =
        new URLSearchParams();


      body.set(
        "code",
        code
      );


      body.set(
        "redirect_uri",
        REDIRECT_URI
      );


      /*
       * These values are optional from n8n's current point of view,
       * but sending them now means the onboarding workflow will
       * receive them when Meta provides them.
       */

      if (
        signupInfo &&
        signupInfo.waba_id
      ) {

        body.set(
          "waba_id",
          signupInfo.waba_id
        );
      }


      if (
        signupInfo &&
        signupInfo.phone_number_id
      ) {

        body.set(
          "phone_number_id",
          signupInfo.phone_number_id
        );
      }


      if (
        signupInfo &&
        signupInfo.business_id
      ) {

        body.set(
          "business_id",
          signupInfo.business_id
        );
      }


      if (
        signupInfo &&
        signupInfo.event
      ) {

        body.set(
          "signup_event",
          signupInfo.event
        );
      }


      // ----------------------------------------------------------
      // SEND TO N8N
      // ----------------------------------------------------------

      try {

        const response =
          await fetch(
            N8N_WEBHOOK,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/x-www-form-urlencoded"
              },

              body:
                body.toString()
            }
          );


        const text =
          await response.text();


        if (!response.ok) {

          throw new Error(
            "n8n returned HTTP " +
            response.status +
            ": " +
            text
          );
        }


        // --------------------------------------------------------
        // SUCCESS
        // --------------------------------------------------------

        showStatus(
          "Authorization code sent successfully. Completing WhatsApp Business Platform connection...",
          "success"
        );


        console.log(
          "n8n response:",
          text
        );


      } catch (error) {

        console.error(
          "Error sending code to n8n:",
          error
        );


        showStatus(
          "The authorization code was received, but it could not be sent to the onboarding workflow. Please try again.",
          "error"
        );


        setButtonDisabled(false);
      }
    }


    // ------------------------------------------------------------
    // HANDLE META OAUTH CALLBACK
    // ------------------------------------------------------------

    function handleOAuthCallback() {

      const urlParams =
        new URLSearchParams(
          window.location.search
        );


      const code =
        urlParams.get("code");


      const returnedState =
        urlParams.get("state");


      const error =
        urlParams.get("error");


      const errorDescription =
        urlParams.get("error_description");


      // ----------------------------------------------------------
      // META ERROR / USER CANCEL
      // ----------------------------------------------------------

      if (error) {

        console.error(
          "Meta OAuth error:",
          error,
          errorDescription
        );


        showStatus(
          "WhatsApp Business onboarding was cancelled or Meta returned an error: " +
          (errorDescription || error),
          "error"
        );


        return;
      }


      // ----------------------------------------------------------
      // NO CODE
      // ----------------------------------------------------------

      if (!code) {

        return;
      }


      // ----------------------------------------------------------
      // VERIFY STATE
      // ----------------------------------------------------------

      const savedState =
        sessionStorage.getItem(
          OAUTH_STATE_KEY
        );


      if (
        !savedState ||
        !returnedState ||
        savedState !== returnedState
      ) {

        console.error(
          "OAuth state validation failed."
        );


        showStatus(
          "Security validation failed. Please restart the WhatsApp Business connection.",
          "error"
        );


        return;
      }


      // ----------------------------------------------------------
      // REMOVE USED STATE
      // ----------------------------------------------------------

      sessionStorage.removeItem(
        OAUTH_STATE_KEY
      );


      // ----------------------------------------------------------
      // SEND CODE TO N8N
      // ----------------------------------------------------------

      sendCodeToN8n(code);
    }


    // ------------------------------------------------------------
    // PAGE LOAD
    // ------------------------------------------------------------

    window.addEventListener(
      "DOMContentLoaded",
      function () {

        handleOAuthCallback();

      }
    );

  </script>

</body>
</html>
