<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    PatrongBAA Farms - WhatsApp Business Onboarding
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: #ffffff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 28px;
      color: #1f2937;
    }

    .logo p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 15px;
    }

    .info {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      color: #166534;
      font-size: 14px;
      line-height: 1.5;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 15px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #1877f2;
      color: white;
    }

    .button:hover {
      background: #166fe5;
    }

    .button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    #status.info {
      display: block;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }

    #status.success {
      display: block;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    #status.error {
      display: block;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

  </style>

</head>


<body>

  <div class="container">

    <div class="logo">

      <h1>
        PatrongBAA Farms
      </h1>

      <p>
        WhatsApp Business Onboarding
      </p>

    </div>


    <div class="info">

      Connect this WhatsApp Business app number to the
      WhatsApp Business Platform while continuing to use
      the WhatsApp Business app.

    </div>


    <button
      id="connectButton"
      class="button"
      onclick="startWhatsAppOnboarding()"
      disabled
    >
      Loading Facebook...
    </button>


    <div id="status"></div>

  </div>


  <!-- =====================================================
       FACEBOOK JAVASCRIPT SDK
       ===================================================== -->

  <script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/en_US/sdk.js">
  </script>


  <script>

    /* =====================================================
       CONFIGURATION
       ===================================================== */

    const APP_ID =
      "1052159027462760";

    const CONFIG_ID =
      "952366671241090";

    const N8N_WEBHOOK =
      "https://bernardmendy.app.n8n.cloud/webhook/patrongbaa-onboarding";


    /* =====================================================
       STATE
       ===================================================== */

    let facebookReady = false;

    let authorizationCode = null;

    let coexistenceInformation = null;

    let webhookSent = false;


    /* =====================================================
       DOM
       ===================================================== */

    const connectButton =
      document.getElementById("connectButton");

    const statusBox =
      document.getElementById("status");


    /* =====================================================
       STATUS FUNCTION
       ===================================================== */

    function setStatus(message, type = "info") {

      statusBox.textContent = message;

      statusBox.className = "";

      statusBox.classList.add(type);

    }


    /* =====================================================
       INITIAL PAGE LOG
       ===================================================== */

    console.log(
      "PatrongBAA Farms WhatsApp Coexistence page loaded."
    );

    console.log(
      "App ID:",
      APP_ID
    );

    console.log(
      "Configuration ID:",
      CONFIG_ID
    );


    /* =====================================================
       IMPORTANT:
       META WA_EMBEDDED_SIGNUP MESSAGE LISTENER

       This listener is installed BEFORE FB.login().

       We are NOT waiting for this event before sending
       the OAuth authorization code to n8n.
       ===================================================== */

    window.addEventListener(
      "message",
      function(event) {

        console.log(
          "MESSAGE RECEIVED",
          {
            origin: event.origin,
            data: event.data,
            dataType: typeof event.data
          }
        );


        /* -------------------------------------------------
           Only inspect Facebook messages
           ------------------------------------------------- */

        if (
          event.origin !== "https://www.facebook.com" &&
          event.origin !== "https://web.facebook.com" &&
          event.origin !== "https://business.facebook.com"
        ) {

          console.log(
            "Ignoring message from non-Facebook origin:",
            event.origin
          );

          return;

        }


        /* -------------------------------------------------
           Try to parse the message
           ------------------------------------------------- */

        let data;

        try {

          data =
            typeof event.data === "string"
              ? JSON.parse(event.data)
              : event.data;

        }

        catch (error) {

          console.log(
            "Facebook message was not JSON",
            event.data
          );

          return;

        }


        /* -------------------------------------------------
           Diagnostic logging
           ------------------------------------------------- */

        console.log(
          "Parsed Facebook message:",
          data
        );


        /* -------------------------------------------------
           Look specifically for WA_EMBEDDED_SIGNUP
           ------------------------------------------------- */

        if (
          !data ||
          data.type !== "WA_EMBEDDED_SIGNUP"
        ) {

          console.log(
            "Facebook message is not WA_EMBEDDED_SIGNUP."
          );

          return;

        }


        /* =================================================
           WA_EMBEDDED_SIGNUP FOUND
           ================================================= */

        console.log(
          "WA_EMBEDDED_SIGNUP RECEIVED",
          data
        );


        coexistenceInformation =
          data;


        const eventName =
          data.event || null;

        const payload =
          data.data || {};


        console.log(
          "WA_EMBEDDED_SIGNUP event:",
          eventName
        );

        console.log(
          "WA_EMBEDDED_SIGNUP payload:",
          payload
        );


        /* -------------------------------------------------
           WABA ID
           ------------------------------------------------- */

        if (payload.waba_id) {

          console.log(
            "WABA ID received:",
            payload.waba_id
          );

        }


        /* -------------------------------------------------
           Phone Number ID
           ------------------------------------------------- */

        if (payload.phone_number_id) {

          console.log(
            "Phone Number ID received:",
            payload.phone_number_id
          );

        }


        /* -------------------------------------------------
           Business ID
           ------------------------------------------------- */

        if (payload.business_id) {

          console.log(
            "Business ID received:",
            payload.business_id
          );

        }


        /* -------------------------------------------------
           Finish event
           ------------------------------------------------- */

        if (
          eventName ===
          "FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING"
        ) {

          console.log(
            "WhatsApp Business Coexistence onboarding FINISHED."
          );


          setStatus(
            "WhatsApp Business Coexistence information received successfully.",
            "success"
          );

        }

      }
    );


    /* =====================================================
       FACEBOOK SDK INITIALIZATION
       ===================================================== */

    window.fbAsyncInit = function() {

      console.log(
        "Initializing Facebook SDK..."
      );


      FB.init({

        appId: APP_ID,

        cookie: true,

        xfbml: true,

        version: "v26.0"

      });


      facebookReady = true;


      console.log(
        "Facebook SDK initialized."
      );


      connectButton.disabled = false;

      connectButton.textContent =
        "Connect WhatsApp Business";


      setStatus(
        "Facebook is ready. Click the button to begin.",
        "info"
      );

    };


    /* =====================================================
       START WHATSAPP COEXISTENCE ONBOARDING
       ===================================================== */

    function startWhatsAppOnboarding() {


      if (!facebookReady) {

        console.error(
          "Facebook SDK is not ready."
        );

        return;

      }


      /* ---------------------------------------------------
         Reset state
         --------------------------------------------------- */

      authorizationCode = null;

      coexistenceInformation = null;

      webhookSent = false;


      connectButton.disabled = true;

      connectButton.textContent =
        "Connecting...";


      setStatus(
        "Opening Meta WhatsApp Business onboarding...",
        "info"
      );


      console.log(
        "Starting FB.login..."
      );


      /* ===================================================
         FACEBOOK LOGIN FOR BUSINESS / EMBEDDED SIGNUP
         =================================================== */

      FB.login(

        function(response) {

          console.log(
            "FB.login response:",
            response
          );


          /* -----------------------------------------------
             Check auth response
             ----------------------------------------------- */

          if (
            !response ||
            !response.authResponse
          ) {

            console.error(
              "No authResponse received."
            );


            connectButton.disabled =
              false;

            connectButton.textContent =
              "Try Again";


            setStatus(
              "Meta did not return an authorization response.",
              "error"
            );

            return;

          }


          /* -----------------------------------------------
             Get authorization code
             ----------------------------------------------- */

          authorizationCode =
            response.authResponse.code;


          console.log(
            "Authorization code received:",
            authorizationCode
              ? "YES"
              : "NO"
          );


          /* -----------------------------------------------
             No code
             ----------------------------------------------- */

          if (!authorizationCode) {

            console.error(
              "Authorization code missing."
            );


            connectButton.disabled =
              false;

            connectButton.textContent =
              "Try Again";


            setStatus(
              "No authorization code was returned by Meta.",
              "error"
            );

            return;

          }


          /* =================================================
             IMPORTANT CORRECTION

             DO NOT WAIT FOR WA_EMBEDDED_SIGNUP.

             Send the OAuth code immediately to n8n.

             The WA_EMBEDDED_SIGNUP postMessage is handled
             independently above.
             ================================================= */

          setStatus(
            "Authorization code received. Sending to backend...",
            "info"
          );


          sendAuthorizationCodeToN8N(
            authorizationCode
          );

        },


        /* ===================================================
           EMBEDDED SIGNUP OPTIONS
           =================================================== */

        {

          config_id:
            CONFIG_ID,

          response_type:
            "code",

          override_default_response_type:
            true,

          extras: {

            setup: {},

            featureType:
              "whatsapp_business_app_onboarding",

            sessionInfoVersion:
              "3"

          }

        }

      );

    }


    /* =====================================================
       SEND AUTHORIZATION CODE TO N8N
       ===================================================== */

    async function sendAuthorizationCodeToN8N(code) {


      if (webhookSent) {

        console.log(
          "Webhook already sent. Skipping duplicate."
        );

        return;

      }


      if (!code) {

        console.error(
          "Cannot send empty authorization code."
        );

        return;

      }


      webhookSent = true;


      console.log(
        "Sending authorization code to n8n..."
      );


      try {

        const response =
          await fetch(
            N8N_WEBHOOK,
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  code: code

                })

            }
          );


        console.log(
          "n8n HTTP status:",
          response.status
        );


        const responseText =
          await response.text();


        console.log(
          "n8n response received."
        );


        if (!response.ok) {

          console.error(
            "n8n returned an error:",
            responseText
          );


          webhookSent = false;


          connectButton.disabled =
            false;

          connectButton.textContent =
            "Try Again";


          setStatus(
            "The authorization code reached n8n, but n8n returned an error. Check the n8n execution.",
            "error"
          );

          return;

        }


        console.log(
          "Authorization code successfully sent to n8n."
        );


        setStatus(
          "Authorization code sent successfully. Completing WhatsApp Business Platform connection...",
          "success"
        );


        connectButton.textContent =
          "Connection Processing";


      }

      catch (error) {

        console.error(
          "Error sending authorization code to n8n:",
          error
        );


        webhookSent = false;


        connectButton.disabled =
          false;

        connectButton.textContent =
          "Try Again";


        setStatus(
          "Could not contact the PatrongBAA Farms backend.",
          "error"
        );

      }

    }

  </script>

</body>

</html>
